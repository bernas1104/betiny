services:
  ngpsql:
    image: postgres:16-alpine
    container_name: betiny-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${BETINY_NPGSQL_USER}
      POSTGRES_PASSWORD: ${BETINY_NPGSQL_PASSWORD}
      POSTGRES_DB: ${BETINY_NPGSQL_DATABASE}
    ports:
      - "${BETINY_NPGSQL_PORT}:5432"
    volumes:
      - ngpsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BETINY_NPGSQL_USER} -d ${BETINY_NPGSQL_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: betiny-redis
    restart: unless-stopped
    env_file: .env
    command: ["redis-server", "--requirepass", "${BETINY_REDIS_PASSWORD}"]
    ports:
      - "${BETINY_REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${BETINY_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ngpsql_data:
  redis_data:
